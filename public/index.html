<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIÈRE — Salão de Beleza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<header class="topo">
  <a href="#inicio" class="logo">LUMIÈRE</a>
  <nav>
    <a href="#servicos">Serviços</a>
    <a href="#profissionais">Equipe</a>
    <a href="#agendar">Agendar</a>
    <a href="#meus">Meus horários</a>
    <button id="btnEquipe" class="btn-linha">Área da equipe</button>
  </nav>
</header>

<main>
  <section id="inicio" class="hero">
    <p class="eyebrow">Salão de beleza</p>
    <h1>Sua beleza, <em>sob a melhor luz.</em></h1>
    <p class="sub">Agende online, sem conflitos de horário e sem esperar no telefone.</p>
    <a href="#agendar" class="btn">Agendar horário</a>
    <p class="horario">Terça a sábado, das 9h às 19h</p>
  </section>

  <section id="servicos" class="secao">
    <h2>Serviços</h2>
    <div id="listaServicos" class="grade"></div>
  </section>

  <section id="profissionais" class="secao alt">
    <h2>Nossa equipe</h2>
    <div id="listaProfs" class="grade"></div>
  </section>

   <section id="agendar" class="secao">
    <h2>Agendar horário</h2>
    <div class="cartao">
      <div class="campos">
        <label>Nome completo
          <input id="nome" type="text" autocomplete="name" required>
        </label>
        <label>Telefone (com DDD)
          <input id="telefone" type="tel" inputmode="numeric" placeholder="(16) 99999-9999" autocomplete="tel" required>
        </label>
        <label>E-mail (opcional)
          <input id="email" type="email" autocomplete="email">
        </label>
        <label>Data de nascimento (opcional)
          <input id="nascimento" type="date">
        </label>
        <label>Serviço
          <select id="servico"></select>
        </label>
        <label>Profissional
          <select id="profissional"></select>
        </label>
        <label>Data
          <input id="data" type="date">
        </label>
      </div>
